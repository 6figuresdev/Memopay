name: CI — Build + TestSprite

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  # ── 1. Build & unit checks ────────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check + lint
        run: bun run check

      - name: Production build
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── 2. Deploy preview to Vercel (PR only) ────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          PREVIEW_URL=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN" 2>&1 | tail -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $PREVIEW_URL"

  # ── 3. TestSprite end-to-end tests ───────────────────────────────────────
  testsprite:
    name: TestSprite E2E
    runs-on: ubuntu-latest
    needs: deploy-preview
    if: github.event_name == 'pull_request'
    env:
      TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
      PROJECT_ID: ${{ secrets.TESTSPRITE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install TestSprite CLI
        run: npm install -g @testsprite/testsprite-cli

      - name: Preflight check
        run: testsprite doctor

      - name: Run TestSprite suite against PR preview
        id: run-tests
        run: |
          testsprite ci run \
            --project "$PROJECT_ID" \
            --target-url "${{ needs.deploy-preview.outputs.preview_url }}" \
            --wait \
            --output json > testsprite-result.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Download failure artifacts (on failure)
        if: failure()
        run: |
          TEST_ID=$(jq -r '.run.testId // empty' testsprite-result.json)
          if [ -n "$TEST_ID" ]; then
            testsprite test failure get "$TEST_ID" --out ./.testsprite/failure
          fi

      - name: Upload failure bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-failure-bundle
          path: ./.testsprite/failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-results
          path: testsprite-result.json
